<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatPulse {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.8; }
        50% { transform: translateY(-8px) scale(1.02); opacity: 1; }
      }
      @keyframes glowMove {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(30px, -20px); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes pulseNode {
        0%, 100% { r: 6; fill-opacity: 0.6; }
        50% { r: 8; fill-opacity: 1; }
      }
      .anim-glow1 {
        animation: glowMove 8s ease-in-out infinite;
      }
      .anim-glow2 {
        animation: glowMove 10s ease-in-out infinite alternate;
      }
      .anim-card {
        animation: floatPulse 6s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: flowDash 3s linear infinite;
      }
      .node-pulse {
        animation: pulseNode 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs (Behind content) -->
  <circle cx="200" cy="100" r="180" fill="url(#glowGrad1)" filter="url(#blurFilter)" class="anim-glow1" />
  <circle cx="1000" cy="300" r="220" fill="url(#glowGrad2)" filter="url(#blurFilter)" class="anim-glow2" />

  <!-- Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Subtle Ambient Circuit / Workflow Path (Background Dynamic Element) -->
  <path d="M 80,340 C 250,340 300,380 480,380 C 660,380 720,330 920,330 C 1040,330 1080,370 1150,370" 
        fill="none" stroke="#4f46e5" stroke-width="2" stroke-opacity="0.35" class="flow-line" />
  <circle cx="480" cy="380" r="6" fill="#38bdf8" class="node-pulse" />
  <circle cx="920" cy="330" r="6" fill="#c084fc" class="node-pulse" />

  <!-- Foreground Title and Branding Content (Never Obscured) -->
  <g transform="translate(600, 110)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="-140" y="-45" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="-115" cy="-29" r="4" fill="#38bdf8" />
    <text x="-100" y="-23" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="start">CURATED BILLING ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="35" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Automated Invoicing &amp; PDF Invoices
    </text>

    <!-- Subtitle -->
    <text x="0" y="75" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0.2">
      Open-Source Engines • Headless PDF Generation • Billing Orchestration
    </text>

    <!-- Tagline -->
    <text x="0" y="110" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
      Enterprise SaaS &amp; Community-Driven Open Source Tools for Developers and Finance Teams
    </text>
  </g>

  <!-- Interactive Floating Feature Cards (Bottom Area) -->
  <g transform="translate(100, 260)" class="anim-card">
    <!-- Card 1: Open-Source Engines -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="78" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#shadowFilter)" />
      <circle cx="34" cy="39" r="16" fill="#0284c7" fill-opacity="0.2" />
      <text x="34" y="44" font-size="18" text-anchor="middle">⚙️</text>
      <text x="62" y="33" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Self-Hosted</text>
      <text x="62" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Invoice Ninja, Crater, Midday</text>
    </g>

    <!-- Card 2: PDF Generators -->
    <g transform="translate(255, 0)">
      <rect x="0" y="0" width="220" height="78" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#shadowFilter)" />
      <circle cx="34" cy="39" r="16" fill="#8b5cf6" fill-opacity="0.2" />
      <text x="34" y="44" font-size="18" text-anchor="middle">📄</text>
      <text x="62" y="33" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">PDF Engines</text>
      <text x="62" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Headless Chromium, Go, PHP</text>
    </g>

    <!-- Card 3: Standard Compliance -->
    <g transform="translate(510, 0)">
      <rect x="0" y="0" width="220" height="78" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#shadowFilter)" />
      <circle cx="34" cy="39" r="16" fill="#ec4899" fill-opacity="0.2" />
      <text x="34" y="44" font-size="18" text-anchor="middle">🌐</text>
      <text x="62" y="33" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">E-Invoicing</text>
      <text x="62" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">UBL, Peppol, Factur-X</text>
    </g>

    <!-- Card 4: Enterprise SaaS -->
    <g transform="translate(765, 0)">
      <rect x="0" y="0" width="220" height="78" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#shadowFilter)" />
      <circle cx="34" cy="39" r="16" fill="#10b981" fill-opacity="0.2" />
      <text x="34" y="44" font-size="18" text-anchor="middle">⚡</text>
      <text x="62" y="33" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">SaaS Giants</text>
      <text x="62" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">QuickBooks, Xero, Bill.com</text>
    </g>
  </g>
</svg>
